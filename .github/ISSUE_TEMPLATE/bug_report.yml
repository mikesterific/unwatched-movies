name: Bug report
description: Something is broken or unexpected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, session cookies, or your real watch-history CSV.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / auth
        - Netflix history
        - Prime Video history
        - Catalog refresh
        - Matching / review
        - Unseen list / export
        - Docs / CI
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Error text, screenshots of the UI (not of your history file), or a reduced fixture.
