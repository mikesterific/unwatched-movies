name: Feature request
description: An idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like the app to do?
    validations:
      required: true
  - type: checkboxes
    id: sources
    attributes:
      label: Data sources
      options:
        - label: This can use official exports or TMDB / JustWatch (no scraping)
          required: true
